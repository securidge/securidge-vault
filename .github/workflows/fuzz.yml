name: Fuzz

# Short runs on every push; long runs weekly. Targets are in /fuzz.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [index_decode, keyfile_parse, vault_open, path_validate]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and defaults to the musl
      # target, which AddressSanitizer does not support; hence --target.
      - name: Run
        working-directory: fuzz
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '1800' || '120' }}
        shell: bash
        run: |
          set -o pipefail
          if ! cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=$SECONDS_TO_RUN -rss_limit_mb=2048 2>&1 | tee fuzz.log; then
            # Surface the failure as one annotation (readable without log access).
            msg=$(grep -E "error|panicked|SUMMARY|ERROR|Test unit|deadly" fuzz.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=fuzz ${{ matrix.target }} failed::${msg}"
            exit 1
          fi
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
