name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build,
# sign (when a certificate is configured), checksum, attest and stage a
# DRAFT GitHub release. A person reviews the draft and publishes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0). Leave empty for a dry run of the current commit."
        required: false
        default: ""

permissions:
  contents: read

env:
  # A manual run without a tag is a dry run: build, sign and package the
  # current commit, upload it as a workflow artifact, publish nothing.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' }}
  TAG: ${{ github.event.inputs.tag || (github.event_name == 'push' && github.ref_name) || 'v0.0.0-dryrun' }}
  REF: ${{ github.event.inputs.tag || github.sha }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    name: Build, sign, attest
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Tag must match the crate version
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          # No build-machine paths in the binary and a deterministic PE
          # header: steps towards reproducible builds (DESIGN.md §9).
          export RUSTFLAGS="--remap-path-prefix=$(cygpath -w "$GITHUB_WORKSPACE")=. --remap-path-prefix=$(cygpath -w "$HOME/.cargo")=cargo -C link-arg=/Brepro"
          cargo build --release --locked -p vault-cli -p vault-gui

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory unsigned | Out-Null
          Copy-Item target\release\SecuridgeVault.exe, target\release\securidge-vault.exe unsigned

      # Signing through SignPath (free for open source; the key stays in
      # their HSM, as CA rules have required since June 2023). Runs only
      # once the repository variable SIGNPATH_ORGANIZATION_ID and secret
      # SIGNPATH_API_TOKEN exist. See docs/RELEASING.md.
      - name: Upload unsigned binaries for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: unsigned/*.exe
          if-no-files-found: error

      - name: Sign (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && env.DRY_RUN != 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'securidge-vault' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Check signatures
        id: sign
        shell: pwsh
        run: |
          if (-not (Test-Path signed)) {
            Copy-Item -Recurse unsigned signed
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::Signing is not configured; this build is UNSIGNED."
            exit 0
          }
          foreach ($f in Get-ChildItem signed\*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne "Valid") { throw "$($f.Name): signature status $($sig.Status)" }
            Write-Host "$($f.Name): signed by $($sig.SignerCertificate.Subject)"
          }
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Package and checksum
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item signed\SecuridgeVault.exe, signed\securidge-vault.exe $out
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, SECURITY.md $out
          $zip = "securidge-vault-$env:TAG-windows-x64.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $zip
          $lines = foreach ($f in "$out\SecuridgeVault.exe", "$out\securidge-vault.exe", $zip) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Dry run output
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            securidge-vault-*-windows-x64.zip
            SHA256SUMS.txt

      - name: Build provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/SecuridgeVault.exe
            dist/securidge-vault.exe
            securidge-vault-*-windows-x64.zip

      - name: Draft release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          {
            echo "> **Pre-release, not independently audited.** Do not use it for data you cannot afford to lose."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Binaries are Authenticode-signed."
            else
              echo "> **Unsigned build.** Windows SmartScreen will warn. Check the SHA-256 below and the build provenance before running."
            fi
            echo
            echo "Verify the download:"
            echo '```'
            echo "gh attestation verify securidge-vault-$TAG-windows-x64.zip -R ${{ github.repository }}"
            echo '```'
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" --draft --prerelease --verify-tag \
            --title "Securidge Vault $TAG" --notes-file notes.md \
            "securidge-vault-$TAG-windows-x64.zip" SHA256SUMS.txt
