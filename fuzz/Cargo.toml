[package]
name = "vault-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
vault-core = { path = "../crates/vault-core", features = ["fuzzing"] }

# Not part of the main workspace: fuzzing needs its own build settings.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "index_decode"
path = "fuzz_targets/index_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keyfile_parse"
path = "fuzz_targets/keyfile_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_open"
path = "fuzz_targets/vault_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_validate"
path = "fuzz_targets/path_validate.rs"
test = false
doc = false
bench = false
